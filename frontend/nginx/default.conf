server {
    listen 80;
    server_name _;

    # Coarse outer bound only. The real per-endpoint caps live in backend-go
    # (internal/shared/upload.go): 1 MB for JSON, 32 MB for document versions,
    # 512 MB for data assets. Keep this at or above the largest of those so an
    # oversized upload gets the API's 413 with a readable message instead of
    # nginx's generic error page.
    client_max_body_size 512m;

    root /usr/share/nginx/html;
    index index.html;

    # nginx:alpine ships with gzip off by default. The largest JS chunk
    # (element-plus, ~900KB) was being served uncompressed; gzip typically
    # cuts JSON/JS/CSS text payloads by 65-75%.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;

    # Do not advertise the nginx version on responses and error pages.
    server_tokens off;

    # Baseline security headers. HSTS is intentionally absent: this deployment is
    # served over plain HTTP, and sending Strict-Transport-Security without TLS
    # would lock clients out. Add it together with the 443 listener.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    # The SPA shell (index.html and the route locations below that serve it)
    # must always be revalidated, otherwise a browser holding a stale index.html
    # after a redeploy will request old, already-deleted hashed chunks and fail
    # to load lazy routes. Hashed assets under /assets/ keep their own immutable
    # long cache (that location sets its own Cache-Control, so it is unaffected).
    add_header Cache-Control "no-cache";

    # `^~` (not a plain prefix) so this always beats the file-extension regex
    # below. Without it, API paths that end in an extension — notably the git
    # smart-HTTP remotes at /api/v1/git/<slug>.git — would be matched by the
    # regex and served as missing static files instead of being proxied.
    #
    # The upstream goes through a variable plus Docker's embedded DNS so nginx
    # re-resolves it. A literal `proxy_pass http://backend-go:8080` is resolved
    # once at nginx start; every time backend-go was recreated (new container
    # IP) the frontend kept proxying to the dead address and all API calls
    # returned 502 until the frontend was restarted too (2026-11-10).
    location ^~ /api/v1/internal/ { return 404; }

    location ^~ /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream backend-go:8080;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Real static assets: only serve files that actually exist.
    location = /index.html {
        try_files /index.html =404;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
        try_files /favicon.ico =404;
    }

    location ^~ /assets/ {
        access_log off;
        log_not_found off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA entry routes. Every request that is not an API call, a real asset or a
    # file-extension lookup is answered with the shell, and the Vue router
    # decides what to render (including its own branded 404 page).
    #
    # This used to be one `location =` block per route, which meant adding a page
    # to the router silently 404'd on refresh until nginx was updated too. The
    # shell is returned directly rather than via `try_files $uri`, so arbitrary
    # request paths are still never probed on disk.
    location / {
        try_files /index.html =404;
    }

    # Requests that look like a static file (anything with an extension) must not
    # fall back to the shell: a missing asset should fail as a missing asset.
    location ~ \.[a-zA-Z0-9]+$ {
        try_files $uri =404;
    }
}
