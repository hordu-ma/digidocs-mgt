services:
  postgres:
    image: postgres:17
    container_name: digidocs-postgres
    restart: unless-stopped
    # json-file 默认不轮转。后端对每个请求打一行访问日志、worker 每 5 秒轮询一次，
    # 不封顶就是慢性占满磁盘。三个服务统一 3×10MB 上限。
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-digidocs_mgt}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-digidocs_mgt}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    # 四个服务此前都没有 CPU/内存上限：这台机器同时跑着 OpenClaw/vLLM
    # 推理容器，任何一个服务失控（比如 worker 处理超大扫描件 OCR 时内存
    # 暴涨）都能挤占同机其它服务的资源，而且完全没有边界。数值按当前实测
    # 用量（个位数 MB）给了充足但不放任的上限，不是精确压测出的下限。
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g

  backend-go:
    build:
      context: ./backend-go
    container_name: digidocs-backend-go
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-DigiDocs Mgt Go API}
      HTTP_ADDR: ${HTTP_ADDR:-:8080}
      APP_ENV: ${APP_ENV:-development}
      API_V1_PREFIX: ${API_V1_PREFIX:-/api/v1}
      DATA_BACKEND: ${DATA_BACKEND:-postgres}
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@postgres:5432/digidocs_mgt?sslmode=disable}
      WORKER_CALLBACK_TOKEN: ${WORKER_CALLBACK_TOKEN:-replace-me}
      JWT_SECRET: ${JWT_SECRET:-dev-secret}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-*}
      LOGIN_RATE_LIMIT_PER_MIN: ${LOGIN_RATE_LIMIT_PER_MIN:-10}
      REGISTER_RATE_LIMIT_PER_MIN: ${REGISTER_RATE_LIMIT_PER_MIN:-5}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      NOTIFY_WEBHOOK_URL: ${NOTIFY_WEBHOOK_URL:-}
      NOTIFY_WEBHOOK_KIND: ${NOTIFY_WEBHOOK_KIND:-generic}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      AUTO_SUMMARIZE_ON_UPLOAD: ${AUTO_SUMMARIZE_ON_UPLOAD:-true}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-memory}
      SYNOLOGY_HOST: ${SYNOLOGY_HOST:-}
      SYNOLOGY_PORT: ${SYNOLOGY_PORT:-5000}
      SYNOLOGY_HTTPS: ${SYNOLOGY_HTTPS:-false}
      SYNOLOGY_INSECURE_SKIP_VERIFY: ${SYNOLOGY_INSECURE_SKIP_VERIFY:-false}
      SYNOLOGY_ACCOUNT: ${SYNOLOGY_ACCOUNT:-}
      SYNOLOGY_PASSWORD: ${SYNOLOGY_PASSWORD:-}
      SYNOLOGY_SHARE_PATH: ${SYNOLOGY_SHARE_PATH:-/DigiDocs}
      CODE_REPO_ROOT: ${CODE_REPO_ROOT:-/tmp/digidocs-code-repos}
    volumes:
      - code_repos:/tmp/digidocs-code-repos
    ports:
      - "${BACKEND_GO_PORT:-18081}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # json-file 默认不轮转。后端对每个请求打一行访问日志、worker 每 5 秒轮询一次，
    # 不封顶就是慢性占满磁盘。三个服务统一 3×10MB 上限。
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # restart: unless-stopped 只处理进程退出，处理不了「进程还在但卡死」
    # （连接池耗尽、群晖调用挂住）。健康检查让这类情况也能被发现并自愈。
    # start_period 给迁移留出时间——迁移失败现在会导致启动失败，属于预期行为。
    # 同样用 127.0.0.1 而非 localhost，理由见前端健康检查的注释。
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "3", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - app
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1g

  backend-py-worker:
    build:
      context: ./backend-py-worker
    container_name: digidocs-backend-py-worker
    restart: unless-stopped
    environment:
      WORKER_NAME: ${WORKER_NAME:-digidocs-py-worker}
      WORKER_MODE: ${WORKER_MODE:-local}
      OPENCLAW_BASE_URL: ${OPENCLAW_BASE_URL:-http://host.docker.internal:18789}
      OPENCLAW_API_KEY: ${OPENCLAW_API_KEY:-replace-me}
      OPENCLAW_MODEL: ${OPENCLAW_MODEL:-openclaw/default}
      OPENCLAW_BACKEND_MODEL: ${OPENCLAW_BACKEND_MODEL:-}
      OPENCLAW_TIMEOUT_SECONDS: ${OPENCLAW_TIMEOUT_SECONDS:-180}
      CALLBACK_BASE_URL: ${CALLBACK_BASE_URL:-http://backend-go:8080}
      CALLBACK_TOKEN: ${CALLBACK_TOKEN:-replace-me}
      POLL_INTERVAL: ${POLL_INTERVAL:-5}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-3}
      MAX_OCR_PAGES: ${MAX_OCR_PAGES:-30}
      MAX_CONTEXT_CHARS: ${MAX_CONTEXT_CHARS:-12000}
      MAX_SUMMARY_SECTIONS: ${MAX_SUMMARY_SECTIONS:-6}
      STREAM_ANSWERS: ${STREAM_ANSWERS:-true}
      PROGRESS_INTERVAL: ${PROGRESS_INTERVAL:-1.0}
      WORKER_HEARTBEAT_FILE: /tmp/digidocs-worker-heartbeat
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # json-file 默认不轮转。后端对每个请求打一行访问日志、worker 每 5 秒轮询一次，
    # 不封顶就是慢性占满磁盘。三个服务统一 3×10MB 上限。
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # worker 不监听端口，没有可探测的 HTTP 面。它每轮轮询会刷新心跳文件，
    # 这里检查心跳新鲜度：超过 6 倍轮询间隔没更新，说明轮询循环卡住了。
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test -f /tmp/digidocs-worker-heartbeat &&
          [ $$(( $$(date +%s) - $$(cat /tmp/digidocs-worker-heartbeat) )) -lt $$(( ${POLL_INTERVAL:-5} * 6 )) ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      backend-go:
        condition: service_healthy
    profiles:
      - app
    # 比其它三个服务给得更宽松：这里跑 pdftoppm/tesseract，大扫描件 OCR 的
    # 内存峰值目前没有实测过上限（见 TASKS.md 待办里的 OCR 页数上限项），
    # 限制太紧会把正常大文件处理直接 OOM 掉，比不限制更糟。
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4g

  frontend:
    build:
      context: ./frontend
    container_name: digidocs-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-18080}:80"
    # json-file 默认不轮转。后端对每个请求打一行访问日志、worker 每 5 秒轮询一次，
    # 不封顶就是慢性占满磁盘。三个服务统一 3×10MB 上限。
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # nginx:alpine 自带 busybox wget（超时参数是 -T，没有 --timeout）。
    # 必须写 127.0.0.1 而不是 localhost：容器内 localhost 先解析到 ::1，而
    # nginx 的 `listen 80` 只绑 IPv4，用 localhost 会得到 Connection refused，
    # 把一个完全正常的前端判成 unhealthy。
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "-T", "3", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      backend-go:
        condition: service_healthy
    profiles:
      - app
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256m

volumes:
  postgres_data:
  code_repos:

networks:
  default:
    name: digidocs-mgt-app
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/24
          gateway: 172.29.0.1
