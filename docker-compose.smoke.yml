# 烟测专用隔离栈。
#
# 为什么存在：`smoke-local.sh` / `smoke-e2e.sh` 会往目标库写入一次性数据（smoke
# 版本、smoke 会话、@digidocs.test 注册账号、邀请链接），而它们的默认地址
# 127.0.0.1:18081 就是演示后端。结果是每跑一次烟测，客户演示环境就多一批测试
# 垃圾；`smoke-e2e.sh` 还会把 seed.sql 重新灌进演示库。
#
# 本 override 让烟测拥有自己的 PostgreSQL、后端和前端，与演示环境完全隔离：
#
#   docker compose -p digidocs-smoke \
#     -f docker-compose.yml -f docker-compose.smoke.yml \
#     --profile app up -d
#
# 隔离点：
#   - 独立 compose project 名（`-p digidocs-smoke`）→ 容器、卷、网络全部独立，
#     `postgres_data` 会变成 `digidocs-smoke_postgres_data`，`down -v` 即彻底清除
#   - 独立容器名与宿主机端口（基础 compose 把 container_name 写死了，不覆盖会冲突）
#   - 独立数据库名 `digidocs_smoke`
#   - **STORAGE_BACKEND=memory**：烟测上传的版本文件不再落到客户群晖的 /DigiDocs
#     共享目录里（此前每轮烟测都会往那儿写 documents/<id>/smoke-v2.txt）
#   - `APP_ENV=smoke`：`smoke-local.sh` 以此判定「我打的是隔离栈」，打到别的环境
#     会直接拒绝执行，除非显式 ALLOW_SMOKE_ON_SHARED=1
#
# 注意：worker 默认不随此栈启动。它需要访问宿主机上的 OpenClaw 网关
# (172.30.0.1:18789)，而本机 UFW 默认 DROP 且只放行了演示栈的 172.29.0.0/24 网段。
# 要跑 assistant 烟测，先为本栈网段补一条放行规则，否则表现为 60s 静默超时而不是
# 连接被拒（详见 docs/部署准备与运行说明.md）。

services:
  postgres:
    container_name: digidocs-smoke-postgres
    environment:
      POSTGRES_DB: digidocs_smoke
    # !override 必需：compose 默认把 ports 列表追加合并，不覆盖的话本栈会
    # 连演示栈的端口一起绑，直接和正在运行的演示环境撞端口。
    ports: !override
      - "${SMOKE_POSTGRES_PORT:-15433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d digidocs_smoke"]

  backend-go:
    container_name: digidocs-smoke-backend-go
    environment:
      APP_NAME: DigiDocs Smoke
      APP_ENV: smoke
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/digidocs_smoke?sslmode=disable
      # 烟测不碰客户 NAS。
      STORAGE_BACKEND: memory
      SYNOLOGY_HOST: ""
      # 与演示栈使用不同密钥，避免任一侧的令牌在另一侧可用。
      JWT_SECRET: ${SMOKE_JWT_SECRET:-smoke-only-not-a-real-secret}
      WORKER_CALLBACK_TOKEN: ${SMOKE_WORKER_CALLBACK_TOKEN:-smoke-only-worker-token}
      # 烟测会连续注册/登录，放宽限流以免自己把自己限掉。
      LOGIN_RATE_LIMIT_PER_MIN: "0"
      # 烟测网段 172.30.0.0/24 未放行模型桥接端口；显式关闭语义检索，避免每次
      # 检索都等嵌入超时再回退。语义检索由 postgres-integration 用 pgvector 覆盖。
      EMBEDDING_BASE_URL: ""
      REGISTER_RATE_LIMIT_PER_MIN: "0"
      CORS_ALLOW_ORIGINS: "*"
    ports: !override
      - "${SMOKE_BACKEND_GO_PORT:-18083}:8080"

  backend-py-worker:
    container_name: digidocs-smoke-backend-py-worker
    environment:
      WORKER_NAME: digidocs-smoke-worker
      CALLBACK_BASE_URL: http://backend-go:8080
      CALLBACK_TOKEN: ${SMOKE_WORKER_CALLBACK_TOKEN:-smoke-only-worker-token}

  frontend:
    container_name: digidocs-smoke-frontend
    ports: !override
      - "${SMOKE_FRONTEND_PORT:-18082}:80"

networks:
  default:
    name: digidocs-smoke-app
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1
